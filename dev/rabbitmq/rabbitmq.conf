# Local development broker for skuhus-device-agent. Not a production configuration:
# it terminates plaintext MQTT and ships fixed credentials in definitions.json.

# Users, permissions and topic permissions come from a file rather than from
# rabbitmqctl, so a broker rebuilt from an empty volume comes back identical.
# The import runs on every boot and overwrites what it defines; anything created
# by hand afterwards survives in the volume, untouched.
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definitions.json

listeners.tcp.default = 5672
management.tcp.port = 15672

mqtt.listeners.tcp.default = 1883

# Section 8 wants per-station credentials. Anonymous MQTT is what the fleet
# broker currently allows, and is the behaviour this configuration exists to not
# reproduce: with no anonymous access there is no default user to fall back to.
mqtt.allow_anonymous = false

# The agent configuration in section 9 has no vhost field, so MQTT clients land
# on the default vhost and identity comes from the username alone.
mqtt.vhost = /
mqtt.exchange = amq.topic

# Section 5.2 connects with clean start and session expiry 0, so this ceiling
# only bounds what a misbehaving client can ask the broker to hold.
mqtt.max_session_expiry_interval_seconds = 86400

log.console = true
log.console.level = info
