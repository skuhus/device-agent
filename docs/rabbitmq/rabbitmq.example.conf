# RabbitMQ settings for a broker the device agents connect to. Read
# docs/rabbitmq/README.md first; the definitions file beside this one holds the
# users, vhost, permissions, queues and bindings.

# Load the users, vhost, permissions, queues and bindings at boot.
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definitions.json

listeners.tcp.default = 5672
management.tcp.port = 15672

# MQTT for the agents and for senders. An agent refuses a plaintext URL unless
# broker.insecure is set, so a deployment listens with TLS; see the README.
mqtt.listeners.tcp.default = 1883
mqtt.allow_anonymous = false
# The vhost an MQTT username without a "vhost:" prefix lands in, so that the
# agents' usernames stay plain.
mqtt.vhost = skuhus
# Where MQTT publishes go, and so the exchange the ingest queues are bound to.
mqtt.exchange = amq.topic
